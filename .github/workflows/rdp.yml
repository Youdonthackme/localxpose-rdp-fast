name: Free Windows RDP (Asia Region - Low Lag)

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "FreeRDPPass123!" -AsPlainText -Force
        New-LocalUser "FreeUser" -Password $Password -Description "Temporary RDP User"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "FreeUser"
        Add-LocalGroupMember -Group "Administrators" -Member "FreeUser"

    - name: Install LocalXpose via Chocolatey
      run: |
        Write-Host "Installing LocalXpose using pre-installed Chocolatey..."
        # Installs cleanly and sets native global path registers automatically
        choco install localxpose -y

    - name: Launch Asia-Pacific Tunnel
      env:
        TOKEN: ${{ secrets.LOCALXPOSER_TOKEN }}
      run: |
        # Force refresh the system path variables so the runner spots the new installation
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path","User")
        
        Write-Host "Authenticating LocalXpose..."
        localxpose account login $env:TOKEN
        
        Write-Host "Starting Asia-Pacific tunnel (Singapore server)..."
        # Spawns a background process natively targeting our low-lag regional nodes
        Start-Process -FilePath "localxpose" -ArgumentList "tunnel", "tcp", "--to", "127.0.0.1:3389", "--region", "ap" -RedirectStandardOutput "loclx.log" -RedirectStandardError "loclx_err.log"
        
        Write-Host "Waiting for URL generation..."
        Start-Sleep -Seconds 10
        
        Write-Host "=============================================="
        Write-Host "YOUR LOW-LAG CONNECTION LOGS BELOW:"
        Write-Host "=============================================="
        if (Test-Path "loclx.log") { Get-Content "loclx.log" }
        if (Test-Path "loclx_err.log") { Get-Content "loclx_err.log" }
        
        Write-Host "=============================================="
        Write-Host "Keeping runner alive..."
        while ($true) { Start-Sleep -Seconds 60 }
