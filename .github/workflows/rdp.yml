name: Free Windows RDP (Singapore - Low Lag)

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "FreeRDPPass123!" -AsPlainText -Force
        New-LocalUser "FreeUser" -Password $Password -Description "Temporary RDP User"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "FreeUser"
        Add-LocalGroupMember -Group "Administrators" -Member "FreeUser"

    - name: Launch Singapore Tunnel
      shell: bash
      run: |
        echo "Starting low-lag Singapore background tunnel..."
        # Uses the correct global endpoint which geo-locates to the nearest server (Singapore/Asia)
        ssh -T -o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 tcp@free.pinggy.io > pinggy.log 2>&1 &
        
        echo "Waiting for URL generation..."
        sleep 12
        
        echo "=============================================="
        echo "YOUR LOW-LAG CONNECTION LOGS BELOW:"
        echo "=============================================="
        cat pinggy.log
        
        echo "=============================================="
        echo "Keeping runner alive..."
        while true; do sleep 60; done
