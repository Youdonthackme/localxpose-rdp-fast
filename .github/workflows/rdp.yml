name: Free Windows RDP (Asia Region - Low Lag)

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "FreeRDPPass123!" -AsPlainText -Force
        New-LocalUser "FreeUser" -Password $Password -Description "Temporary RDP User"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "FreeUser"
        Add-LocalGroupMember -Group "Administrators" -Member "FreeUser"

    - name: Install LocalXpose Client
      run: |
        echo "Installing LocalXpose via npm..."
        npm install -g loclx

    - name: Launch Asia-Pacific Tunnel
      env:
        TOKEN: ${{ secrets.LOCALXPOSER_TOKEN }}
      run: |
        Write-Host "Authenticating LocalXpose..."
        loclx account login $env:TOKEN
        
        Write-Host "Starting Asia-Pacific tunnel (Singapore server)..."
        # Start-Process runs the tunnel in the background natively on Windows
        Start-Process -FilePath "loclx" -ArgumentList "tunnel", "tcp", "--to", "127.0.0.1:3389", "--region", "ap" -RedirectStandardOutput "loclx.log" -RedirectStandardError "loclx_err.log"
        
        Write-Host "Waiting for URL generation..."
        Start-Sleep -Seconds 8
        
        Write-Host "=============================================="
        Write-Host "YOUR LOW-LAG CONNECTION LOGS BELOW:"
        Write-Host "=============================================="
        if (Test-Path "loclx.log") { Get-Content "loclx.log" }
        if (Test-Path "loclx_err.log") { Get-Content "loclx_err.log" }
        
        Write-Host "=============================================="
        Write-Host "Keeping runner alive..."
        while ($true) { Start-Sleep -Seconds 60 }
