name: Free Windows RDP (Asia Region - Low Lag)

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360 

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1

    - name: Create RDP User Credentials
      run: |
        $Password = ConvertTo-SecureString "FreeRDPPass123!" -AsPlainText -Force
        New-LocalUser "FreeUser" -Password $Password -Description "Temporary RDP User"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "FreeUser"
        Add-LocalGroupMember -Group "Administrators" -Member "FreeUser"

    - name: Launch Asia-Pacific Serveo Tunnel
      run: |
        Write-Host "Connecting to Serveo... Please wait."
        
        # Spawns the native SSH connection link in the background
        Start-Process -FilePath "ssh" -ArgumentList "-T", "-o", "StrictHostKeyChecking=no", "-R", "0:localhost:3389", "serveo.net" -RedirectStandardOutput "serveo.log" -RedirectStandardError "serveo_err.log"
        
        Write-Host "Waiting for address generation..."
        Start-Sleep -Seconds 20
        
        Write-Host "=============================================="
        Write-Host "YOUR LOW-LAG CONNECTION LOGS BELOW:"
        Write-Host "=============================================="
        if (Test-Path "serveo.log") { Get-Content "serveo.log" }
        if (Test-Path "serveo_err.log") { Get-Content "serveo_err.log" }
        
        Write-Host "=============================================="
        Write-Host "Keeping runner alive..."
        while ($true) { Start-Sleep -Seconds 60 }
